name: Build ARM64 Linux Kernel (LLVM)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4
      with: 
        submodules: recursive
        fetch-depth: 1
    - name: Show common
      run: ls /home/runner/work/kernel_build/kernel_build/common/; as --version; echo Current dir $PWD
    - name: Build Dependencies
      id: build_depends
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ccache lld clang llvm
    - name: Configure kernel
      run: mkdir ~/.ccache
    - name: Cache ccache
      uses: actions/cache@v3
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ hashFiles('**/*.c', '**/*.cpp', '**/*.h') }}
        restore-keys: ${{ runner.os }}-ccache-
    - name: Build kernel
      id: gmake_build
      run: export AS=llvm-as ARCH=arm64; KERNEL_DIR=common BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh
    - name: Show ccache stats
      run: ccache -s
    - name: Upload Build Artifact
      if: ${{ always() && steps.gmake_build.outcome == 'success' }}
      uses: actions/upload-artifact@v6
      with:
        name: gki-kernel
        path: out/android11-5.4/dist/
